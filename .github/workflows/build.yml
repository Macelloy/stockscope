name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: kivy/buildozer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install missing deps and build
        run: |
          apt-get update -qq
          apt-get install -y autoconf automake autopoint gettext libtool
          find / -name "__init__.py" -path "*/buildozer/__init__.py" 2>/dev/null | xargs -I{} sed -i 's/self.check_root()/pass/' {}
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockScope-APK
          path: bin/*.apk
          if-no-files-found: error
