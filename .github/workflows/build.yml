name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: kivy/buildozer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          sed -i 's/def check_root/def check_root_disabled/' /home/user/.venv/lib/python3.12/site-packages/buildozer/__init__.py
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockScope-APK
          path: bin/*.apk
          if-no-files-found: error
